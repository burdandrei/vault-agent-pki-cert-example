# ---------------------------------------------------------------------------
# nginx.conf — example nginx configuration
#
# Certs are provisioned by Vault Agent and written to certs/ at the repo root,
# which is mounted into the container at /certs:
#   /certs/nginx-cert.pem    — certificate (+ intermediate chain)
#   /certs/nginx-privkey.pem — private key
#
# nginx/success.html is mounted at /usr/share/nginx/html/index.html.
#
# Start:  bash nginx/start-nginx.sh
# Reload: bash nginx/reload-nginx.sh  (or Vault Agent exec runs it automatically)
# ---------------------------------------------------------------------------

events {
    worker_connections 1024;
}

http {
    # -----------------------------------------------------------------------
    # HTTP — redirect all traffic to HTTPS
    # -----------------------------------------------------------------------
    server {
        listen      80;
        server_name nginx.hashicorp.ibm;

        return 301 https://$host$request_uri;
    }

    # -----------------------------------------------------------------------
    # HTTPS — TLS termination with Vault-issued certificate
    # -----------------------------------------------------------------------
    server {
        listen      443 ssl;
        server_name nginx.hashicorp.ibm;

        ssl_certificate     /certs/nginx-cert.pem;
        ssl_certificate_key /certs/nginx-privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            root  /usr/share/nginx/html;
            index index.html;
        }
    }
}
