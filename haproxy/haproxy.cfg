# ---------------------------------------------------------------------------
# haproxy.cfg — example HAProxy configuration
#
# The TLS bundle is provisioned by Vault Agent and written to certs/ at the
# repo root, which is mounted into the container at /certs:
#   /certs/haproxy-bundle.pem — private key + certificate + chain (HAProxy format)
#
# HAProxy requires the private key and the full certificate chain to be
# concatenated into a single PEM file.  haproxy/reload-haproxy.sh assembles
# that bundle from the individual files written by Vault Agent and then
# sends SIGHUP to the container.
#
# haproxy/success.html is mounted at /etc/haproxy/success.html and served
# directly via "http-request return" — no backend process required.
# ---------------------------------------------------------------------------

global
    log         stdout format raw local0
    maxconn     1024

defaults
    log     global
    mode    http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

# ---------------------------------------------------------------------------
# Frontend — HTTPS TLS termination with Vault-issued certificate
# ---------------------------------------------------------------------------
frontend https_front
    bind *:8443 ssl crt /certs/haproxy-bundle.pem ssl-min-ver TLSv1.2
    http-request return status 200 content-type "text/html; charset=utf-8" file /etc/haproxy/success.html

# ---------------------------------------------------------------------------
# Frontend — HTTP redirect to HTTPS
# ---------------------------------------------------------------------------
frontend http_front
    bind *:8080
    redirect scheme https code 301
